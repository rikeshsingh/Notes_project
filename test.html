<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Note and Interview Prep - DYNAMIC TEST</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: #f5f5f5; }
    .test-banner { 
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, #4CAF50, #45a049);
      color: white;
      padding: 12px 20px;
      z-index: 2000;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }
    .app-grid {
      margin-top: 50px;
    }
  </style>
</head>
<body>
  <div class="test-banner">
    ✓ DYNAMIC MODE - Categories, tabs, and notes load from data.json
  </div>
  
  <div class="app-grid">
    <aside class="sidebar">
      <div class="profile">
        <div class="avatar">RS</div>
        <div class="profile-name"><span id="user-name">Rakesh Singh</span></div>
      </div>
      <div class="sidebar-sections">
        <h4 class="sidebar-title">Categories</h4>
        <ul class="categories">
          <!-- Categories will be generated dynamically from data.json -->
        </ul>
      </div>
      <div class="sidebar-footer">
        <button class="theme-toggle" aria-pressed="false" title="Toggle theme">🌙</button>
      </div>
    </aside>

    <section class="notes-list">
      <div class="list-header">
        <input id="search" placeholder="Search notes..." />
        <button id="add-note" class="btn">+ Add Note</button>
      </div>
      <div id="notes-list" class="list"></div>
    </section>

    <main class="note-content">
      <div class="content-header">
        <div class="tag-dot"></div>
        <div id="sync-status" class="sync-status">
          <span class="dot connected"></span>
          <span class="label">Dynamic: Ready</span>
        </div>
        <select id="category-select" class="category-select"></select>
        <div style="margin-left:auto;display:flex;gap:8px;align-items:center" class="note-actions">
          <button id="modify-note-btn" class="btn">Modify</button>
          <button id="delete-note-btn" class="btn secondary">Delete</button>
          <button id="btn-signout" class="signout-btn light" title="Sign out" style="margin-left:8px;display:none">Sign out</button>
        </div>
      </div>
      <article class="note-article">
        <h2 id="note-title">Select a note</h2>
        <div id="content">Pick a note from the middle column to view the answer.</div>
      </article>
    </main>
  </div>

  <footer>
    <small>Dynamic mode enabled - All categories and notes load from data.json</small>
  </footer>

  <script>
    // Disable Firebase for testing - use local data only
    window.FIREBASE_CONFIG = null;
    console.log('Firebase disabled for dynamic testing');
  </script>
  <script src="script.js"></script>
</body>
</html>
