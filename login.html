<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notes — Sign in</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <section class="auth-card">
      <h1>Sign in to Notes</h1>
      <p>Create an account or sign in to access shared notes.</p>

      <div>
        <input id="displayName" class="auth-input" placeholder="Full name (for profile)">
        <input id="email" class="auth-input" placeholder="Email">
        <input id="password" class="auth-input" type="password" placeholder="Password">

        <div class="auth-row" style="margin-top:8px">
          <button id="btn-signup" class="auth-btn">Create account</button>
          <button id="btn-signin" class="auth-btn secondary">Sign in</button>
        </div>

        <div style="margin-top:16px;color:var(--muted);font-size:14px">Or sign in with Google</div>
        <div style="margin-top:8px">
          <button id="btn-google" class="auth-btn auth-google">Sign in with Google</button>
        </div>

        <div id="auth-msg" class="auth-msg"></div>
      </div>
    </section>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script src="firebase-auth.js"></script>
</body>
</html>
